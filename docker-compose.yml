services:

  db:
    image: postgres:18-alpine
    container_name: cyberguard-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: cyberguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cyberguard_dev_password

    ports:
      - "5433:5432"

    volumes:
      - cyberguard_pgdata:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d cyberguard"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    container_name: cyberguard-backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:cyberguard_dev_password@db:5432/cyberguard

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend

    container_name: cyberguard-frontend

    restart: unless-stopped

    environment:
      NODE_ENV: production

    ports:
      - "3001:3000"

    depends_on:
      - backend


volumes:
  cyberguard_pgdata: